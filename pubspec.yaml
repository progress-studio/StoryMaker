name: storymaker
description: "A visual novel game story maker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  story_dart: ^0.0.1
  file_picker: ^8.1.3
  flutter_platform_alert: ^0.6.1
  window_manager: ^0.4.3
  undo: ^1.5.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SCDream
      fonts:
        - asset: assets/font/Pretendard-Bold.otf
        - asset: assets/font/Pretendard-Medium.otf
        - asset: assets/font/Pretendard-Regular.otf
  assets:
    - assets/image/